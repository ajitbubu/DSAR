name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      IDP_REQUIRE_DB: "1"
      IDP_TEST_DATABASE_URL_MIGRATOR: postgresql+psycopg://idp_migrator:ci-migrator@localhost:5432/idprivacy_test
      IDP_TEST_DATABASE_URL_APP: postgresql+psycopg://idp_app:ci-app@localhost:5432/idprivacy_test
      IDP_TEST_DATABASE_URL_RELAY: postgresql+psycopg://idp_relay:ci-relay@localhost:5432/idprivacy_test
      IDP_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create least-privilege roles (same script as local Compose)
        env:
          PGHOST: localhost
          PGPASSWORD: ci-postgres
          POSTGRES_USER: postgres
          IDP_MIGRATOR_PASSWORD: ci-migrator
          IDP_APP_PASSWORD: ci-app
          IDP_RELAY_PASSWORD: ci-relay
        run: ./infra/compose/postgres/init/01-roles.sh
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/src apps/worker/src packages/mock-connectors/src packages/connector-sdk/src
      # Coverage floors match the Makefile `coverage` target; raise both together.
      - name: API tests (coverage floor 90%)
        working-directory: apps/api
        run: uv run pytest -q --cov=idprivacy --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Worker tests (coverage floor 90%)
        working-directory: apps/worker
        run: uv run pytest -q --cov=idprivacy_worker --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Connector SDK and mock-connector conformance (coverage floor 90%)
        run: >-
          uv run pytest -q packages/connector-sdk/tests packages/mock-connectors/tests
          --cov=idprivacy_connector_sdk --cov=mock_connectors
          --cov-report=term-missing:skip-covered --cov-fail-under=90

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm coverage:web  # unit tests + coverage floor (apps/web/vitest.config.ts)
      - run: pnpm build:web

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the full history
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Python dependency audit
        run: |
          uv export --all-packages --no-dev --no-emit-workspace --no-hashes -q -o req.txt
          uvx pip-audit -r req.txt --disable-pip --no-deps --progress-spinner off
      - name: npm dependency audit
        run: pnpm audit --prod
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python, web, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @idprivacy/web exec playwright install --with-deps chromium
      - run: make up
      - run: make smoke
      - run: pnpm test:e2e
        env:
          CI: "true"
      - run: make logscan
      - if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs --tail=200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
