name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      IDP_REQUIRE_DB: "1"
      IDP_TEST_DATABASE_URL_MIGRATOR: postgresql+psycopg://idp_migrator:ci-migrator@localhost:5432/idprivacy_test
      IDP_TEST_DATABASE_URL_APP: postgresql+psycopg://idp_app:ci-app@localhost:5432/idprivacy_test
      IDP_TEST_DATABASE_URL_RELAY: postgresql+psycopg://idp_relay:ci-relay@localhost:5432/idprivacy_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create least-privilege roles (same script as local Compose)
        env:
          PGHOST: localhost
          PGPASSWORD: ci-postgres
          POSTGRES_USER: postgres
          IDP_MIGRATOR_PASSWORD: ci-migrator
          IDP_APP_PASSWORD: ci-app
          IDP_RELAY_PASSWORD: ci-relay
        run: ./infra/compose/postgres/init/01-roles.sh
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/src apps/worker/src packages/mock-connectors/src
      - name: API tests
        working-directory: apps/api
        run: uv run pytest -q
      - name: Worker tests
        working-directory: apps/worker
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm test:web
      - run: pnpm build:web

  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make smoke
      - if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs --tail=200
