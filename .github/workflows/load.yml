name: nightly-load

# Load-tests the full Compose stack every night (and on demand). Catches capacity
# regressions such as the threadpool/DB-pool deadlock (CSO finding 27c0d030f50e).
on:
  schedule:
    - cron: "30 2 * * *"  # 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash  # explicit bash adds -o pipefail, so `| tee` can't hide a failed gate
    env:
      # The staff scenarios use one account; lift its per-user limit for this run only,
      # so the test measures capacity instead of the rate limiter.
      IDP_RATE_LIMIT_STAFF_PER_USER: "10000/1"  # max hits allowed (10,000) per 1 s window
      DURATION: "15"
      MAX_ERROR_PCT: "0"
      MAX_P95_MS: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: make up
      - name: Staff case list (past the old deadlock threshold)
        run: STAGES=10,50,100 uv run python tools/load/load.py staff_case_list | tee -a load-results.jsonl
      - name: Staff case detail
        run: STAGES=10,40,80 uv run python tools/load/load.py staff_case_detail | tee -a load-results.jsonl
      - name: Public intake
        run: STAGES=10,40 uv run python tools/load/load.py public_submit | tee -a load-results.jsonl
      - name: Web intake page
        run: STAGES=10,40 uv run python tools/load/load.py web_intake_page | tee -a load-results.jsonl
      - name: API still healthy after the load
        run: curl -fsS --max-time 5 http://localhost:8000/readyz
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: load-results.jsonl
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs --tail=200 api web
