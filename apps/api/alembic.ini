[alembic]
script_location = migrations
# URL comes from IDP_DATABASE_URL_MIGRATOR (see migrations/env.py); never stored here.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
