[project]
name = "idprivacy"
version = "0.1.0"
description = "ID-PRIVACY DPAR/DSAR Automation — API and shared domain package"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "structlog>=24.4",
  "redis>=5.0",
  "boto3>=1.35",
  "idprivacy-connector-sdk",
  "pyyaml>=6.0",
]

[tool.uv.sources]
idprivacy-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idprivacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
