[project]
name = "idprivacy-worker"
version = "0.1.0"
description = "Celery workers and outbox relay for ID-PRIVACY"
requires-python = ">=3.12,<3.13"
dependencies = [
  "idprivacy",
  "celery[redis]>=5.4",
]

[tool.uv.sources]
idprivacy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idprivacy_worker"]
