# Local development stack. Not a production topology (see docs/architecture/system-context.md §6).
name: idprivacy

x-python-env: &python-env
  # "test" (a dev-only environment, like "local") also mounts the mock-OTP inspection
  # endpoint so the web app can show the code and Playwright can read it.
  IDP_ENV: ${IDP_ENV:-test}
  IDP_BFF_SHARED_SECRET: ${IDP_BFF_SHARED_SECRET:-dev-bff-shared-secret-change-me-0123456789}
  IDP_DATABASE_URL_APP: postgresql+psycopg://idp_app:${IDP_APP_PASSWORD:-dev-app}@postgres:5432/idprivacy
  IDP_DATABASE_URL_RELAY: postgresql+psycopg://idp_relay:${IDP_RELAY_PASSWORD:-dev-relay}@postgres:5432/idprivacy
  IDP_REDIS_URL: redis://redis:6379/0
  IDP_OIDC_ISSUER: http://localhost:8080/realms/idprivacy
  IDP_OIDC_AUDIENCE: idprivacy-api
  IDP_OIDC_JWKS_URL: http://keycloak:8080/realms/idprivacy/protocol/openid-connect/certs
  IDP_LOCAL_MASTER_KEY: ${IDP_LOCAL_MASTER_KEY:-ZGV2LW9ubHktbWFzdGVyLWtleS0zMi1ieXRlcyEhISE=}
  IDP_S3_ENDPOINT_URL: http://object-storage:8333
  IDP_S3_BUCKET: idprivacy-evidence
  IDP_S3_ACCESS_KEY_ID: idp-s3-dev            # matches seaweedfs/s3.json (dev only)
  IDP_S3_SECRET_ACCESS_KEY: dev-s3-secret
  # Connector credential, resolved via credential_ref "env:IDP_CONNECTOR_TOKEN_MOCK" (D-5).
  IDP_CONNECTOR_TOKEN_MOCK: ${MOCK_CONNECTOR_TOKEN:-dev-mock-connector-token-0123}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-dev-postgres}
      IDP_MIGRATOR_PASSWORD: ${IDP_MIGRATOR_PASSWORD:-dev-migrator}
      IDP_APP_PASSWORD: ${IDP_APP_PASSWORD:-dev-app}
      IDP_RELAY_PASSWORD: ${IDP_RELAY_PASSWORD:-dev-relay}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idprivacy"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:16379:6379"]   # host 6379 is often taken
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  object-storage:   # SeaweedFS S3 gateway: local S3-compatible stand-in (MinIO images are no longer published)
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 3s
      retries: 40

  storage-init:
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: api }
    environment: *python-env
    volumes: [./storage-init.py:/storage-init.py:ro]
    command: ["python", "/storage-init.py"]
    depends_on: { object-storage: { condition: service_healthy } }

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-keycloak-admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes: [./keycloak/idprivacy-realm.json:/opt/keycloak/data/import/idprivacy-realm.json:ro]
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      retries: 40

  migrate:
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: api }
    environment:
      <<: *python-env
      IDP_DATABASE_URL_MIGRATOR: postgresql+psycopg://idp_migrator:${IDP_MIGRATOR_PASSWORD:-dev-migrator}@postgres:5432/idprivacy
    command: ["sh", "-c", "alembic upgrade head && python -m idprivacy.scripts.policy_packs publish && python -m idprivacy.scripts.seed_dev"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: api }
    environment: *python-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz').status==200 else 1)"]
      interval: 5s
      retries: 20

  worker:
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: worker }
    environment: *python-env
    command: ["celery", "-A", "idprivacy_worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  outbox-relay:
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: worker }
    environment: *python-env
    command: ["python", "-m", "idprivacy_worker.relay"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  mock-connectors:
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: mock-connectors }
    environment:
      MOCK_CONNECTOR_TOKEN: ${MOCK_CONNECTOR_TOKEN:-dev-mock-connector-token-0123}
      MOCK_TEST_ENDPOINTS: "true"
    ports: ["127.0.0.1:8100:8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz')"]
      interval: 5s
      retries: 20

  web:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    environment:
      API_BASE_URL: http://api:8000
      APP_ORIGIN: http://localhost:3000
      BFF_SHARED_SECRET: ${IDP_BFF_SHARED_SECRET:-dev-bff-shared-secret-change-me-0123456789}
      DEV_SHOW_MOCK_OTP: "true"
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/idprivacy
      OIDC_CLIENT_ID: idprivacy-web
      OIDC_CLIENT_SECRET: dev-web-client-secret   # matches the dev realm fixture
      REDIS_URL: redis://redis:6379/1
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  s3data:
