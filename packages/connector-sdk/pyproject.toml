[project]
name = "idprivacy-connector-sdk"
version = "0.1.0"
description = "Connector SDK for ID-PRIVACY: interface, wire models, HTTP adapter, conformance kit"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idprivacy_connector_sdk"]
