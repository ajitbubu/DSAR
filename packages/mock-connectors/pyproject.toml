[project]
name = "idprivacy-mock-connectors"
version = "0.1.0"
description = "Simulated CRM and document-store systems for local development (M3 fills these in)"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_connectors"]
