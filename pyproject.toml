[project]
name = "idprivacy-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/connector-sdk", "packages/mock-connectors"]

[tool.uv.sources]
idprivacy = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PTH"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S608"]
"**/migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["idprivacy", "idprivacy_worker", "mock_connectors", "tests"]

[[tool.mypy.overrides]]
module = ["idprivacy_worker.*"]
disallow_untyped_decorators = false  # celery decorators are untyped
